<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Race Live 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#080b17;color:white;font:15px system-ui,Arial;display:flex;justify-content:center}#app{position:relative;width:min(100vw,56.25vh);height:100vh;min-height:650px;overflow:hidden;background:#111827}canvas{display:block;width:100%;height:100%}header{position:absolute;top:0;width:100%;padding:16px;background:linear-gradient(#070a19e8,transparent);text-align:center;pointer-events:none}h1{font-size:23px;margin:0;color:#ffdd54;text-shadow:0 2px 12px #000}.small{font-size:12px;color:#b7c7e6}#hud{position:absolute;top:85px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge{background:#101b34dd;padding:8px;border:1px solid #47618a;border-radius:10px;font-weight:700}#ranking{position:absolute;top:132px;right:8px;background:#080f25dc;border:1px solid #456084;border-radius:10px;padding:9px;font-size:12px;max-width:45%;min-width:130px}#ranking div{margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#notice{position:absolute;left:8px;top:133px;width:44%;font-size:12px;color:#ffeb9c;text-shadow:0 2px 3px #000}#controls{position:absolute;bottom:0;width:100%;padding:12px;background:linear-gradient(transparent,#050a17 18%);display:grid;gap:7px}input,button{border:0;border-radius:8px;padding:10px;font:inherit}input{min-width:0;background:#e8edf7;color:#111}button{background:#ffcb37;color:#10131c;font-weight:800;cursor:pointer}button.alt{background:#7ad8ff}button:disabled{opacity:.45}.row{display:flex;gap:6px}.row input{flex:1}.row button{flex-shrink:0}.hint{font-size:11px;text-align:center;color:#c7d3ea}#status{color:#a4ffbe}</style></head><body><div id="app"><canvas id="game"></canvas><header><h1>🏎️ TURBO RACE LIVE</h1><div class="small">CORRIDA 3D • SIGA PARA ENTRAR 🏎️</div></header><div id="hud"><div class="badge" id="round">🏁 Rodada 1</div><div class="badge" id="timer">⏱️ 60s</div></div><div id="notice">Aguardando pilotos...</div><div id="ranking"><b>🏆 CLASSIFICAÇÃO</b><div id="positions"></div></div><div id="controls"><div class="row"><input id="name" maxlength="16" placeholder="Nome do novo seguidor"><button id="join">❤️ TESTAR FOLLOW</button></div><div class="row"><button class="alt" id="rose">🌹 Rosa = Turbo</button><button id="gift">🎁 Super Turbo</button></div><div class="hint"><span id="status">AGUARDANDO CONEXÃO</span> • Follows reais exigem relay compatível • Botões são testes</div></div></div><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);let W=450,H=800,dpr=1;function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const colors=['#ff445a','#38a7ff','#ffe04a','#49ed9e','#b17aff','#ff9b3c','#ff6de2','#80f0ff'];let waiting=[],seenFollows=new Set(),cars=[],round=1,elapsed=0,phase='race',pause=0,last=performance.now(),feed='Digite um nome para entrar!',feedUntil=0;const duration=60;const rand=(a,b)=>a+Math.random()*(b-a);function announce(s){feed=s;feedUntil=performance.now()+4200;$('#notice').textContent=s}function add(name){name=(name||'').trim().slice(0,16);if(!name)return;let existing=cars.find(c=>c.name.toLowerCase()===name.toLowerCase());if(existing){announce(name+' já está na pista!');return}if(cars.length>=8){if(!waiting.some(n=>n.toLowerCase()===name.toLowerCase()))waiting.push(name);announce('❤️ '+name+' entrou na fila para a próxima rodada!');return}cars.push({name,color:colors[cars.length],lane:cars.length,progress:0,speed:rand(.75,1.05),turbo:0,super:0,wins:0});announce('🏎️ '+name+' entrou na corrida!')}function onFollow(username, eventId){
  if(typeof username!=='string'||!username.trim())return;
  const key=String(eventId||'').trim();
  if(key&&seenFollows.has(key))return;
  if(key){seenFollows.add(key);if(seenFollows.size>5000)seenFollows.delete(seenFollows.values().next().value)}
  add(username);
}
// Somente eventos "follow" confirmados pelo conector devem chamar onFollow.
// Formato: {"type":"follow","username":"usuario","eventId":"id-unico","confirmed":true}
let socket,retry=1000;
function connect(){
  const params=new URLSearchParams(location.search);
  const url=params.get('relay')||'ws://127.0.0.1:8765';
  if(!/^wss?:\/\//.test(url))return;
  try{socket=new WebSocket(url)}catch(e){$('#status').textContent='SEM CONEXÃO • TESTE MANUAL';return}
  socket.onopen=()=>{$('#status').textContent='CONECTADO AO RELAY • AGUARDANDO FOLLOWS';retry=1000};
  socket.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==='follow'&&msg.confirmed===true&&typeof msg.username==='string')onFollow(msg.username,msg.eventId)}catch(err){}};
  socket.onclose=()=>{$('#status').textContent='RELAY OFFLINE • TESTE MANUAL';setTimeout(connect,retry);retry=Math.min(retry*2,15000)};
  socket.onerror=()=>socket.close();
}
connect();function boost(kind){let name=$('#name').value.trim();let car=cars.find(c=>c.name.toLowerCase()===name.toLowerCase());if(!car){announce('Digite o nome de um piloto participante!');return}if(phase!=='race'){announce('Aguarde a próxima corrida!');return}if(kind==='rose')car.turbo=Math.max(car.turbo,3);else car.super=Math.max(car.super,5);announce((kind==='rose'?'🌹 TURBO: ':'🎁 SUPER TURBO: ')+car.name)}$('#join').onclick=()=>{onFollow($('#name').value);$('#name').value=''};$('#rose').onclick=()=>boost('rose');$('#gift').onclick=()=>boost('gift');$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')$('#join').click()});
function startNext(){round++;elapsed=0;phase='race';if(waiting.length){cars=[];while(waiting.length&&cars.length<8)add(waiting.shift())}cars.forEach(c=>{c.progress=0;c.turbo=0;c.super=0;c.speed=rand(.75,1.05)});announce('🏁 Começou a rodada '+round+'!')}function update(dt){if(phase==='race'){elapsed+=dt;for(let c of cars){c.turbo=Math.max(0,c.turbo-dt);c.super=Math.max(0,c.super-dt);let factor=c.super>0?2.8:c.turbo>0?1.85:1;c.progress+=dt*c.speed*factor/duration}if(elapsed>=duration){phase='results';pause=7;let winner=[...cars].sort((a,b)=>b.progress-a.progress)[0];if(winner){winner.wins++;announce('🏆 '+winner.name+' VENCEU!')}else announce('⏳ Sem pilotos nesta rodada!')}}else{pause-=dt;if(pause<=0)startNext()}$('#round').textContent='🏁 Rodada '+round;$('#timer').textContent=phase==='race'?'⏱️ '+Math.max(0,Math.ceil(duration-elapsed))+'s':'🏆 RESULTADO';$('#positions').innerHTML=[...cars].sort((a,b)=>b.progress-a.progress).map((c,i)=>`<div><span style="color:${c.color}">●</span> ${i+1}º ${escapeHtml(c.name)} ${c.super>0?'🚀':c.turbo>0?'⚡':''}</div>`).join('')||'<div>Sem pilotos</div>';if(performance.now()>feedUntil&&cars.length)$('#notice').textContent='❤️ Siga o perfil para entrar na corrida!' ;}function escapeHtml(s){return s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function poly(points,fill){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}function drawCar(x,y,w,h,color,boosted){ctx.save();ctx.translate(x,y);ctx.shadowColor=boosted?'#5cf9ff':'#000';ctx.shadowBlur=boosted?20:10;ctx.fillStyle='#090b12';ctx.fillRect(-w*.62,-h*.28,w*.25,h*.26);ctx.fillRect(w*.37,-h*.28,w*.25,h*.26);ctx.fillRect(-w*.62,h*.22,w*.25,h*.24);ctx.fillRect(w*.37,h*.22,w*.25,h*.24);ctx.shadowBlur=0;ctx.fillStyle=color;ctx.fillRect(-w*.45,-h*.42,w*.9,h*.12);poly([[-w*.26,-h*.35],[w*.26,-h*.35],[w*.34,h*.34],[-w*.34,h*.34]],color);ctx.fillStyle='#16233e';poly([[-w*.18,-h*.15],[w*.18,-h*.15],[w*.12,h*.13],[-w*.12,h*.13]],'#152441');ctx.fillStyle='#f2f5ff';ctx.fillRect(-w*.42,h*.32,w*.84,h*.08);if(boosted){ctx.fillStyle='#6bfaff';ctx.beginPath();ctx.moveTo(-w*.13,h*.43);ctx.lineTo(0,h*.85+Math.random()*8);ctx.lineTo(w*.13,h*.43);ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let horizon=H*.24,base=H*.88;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#09102d');sky.addColorStop(1,'#355b9a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#253b38';ctx.fillRect(0,horizon,W,H-horizon);for(let i=0;i<18;i++){let x=i*W/17;poly([[x,horizon],[x+W*.04,horizon-25-(i%4)*13],[x+W*.09,horizon]],'#182c4b')}let trackTop=W*.16,trackBottom=W*.98;poly([[W/2-trackTop/2,horizon],[W/2+trackTop/2,horizon],[W/2+trackBottom/2,base],[W/2-trackBottom/2,base]],'#333b4c');for(let i=0;i<9;i++){let t=i/9,tt=(i+1)/9,y=horizon+(base-horizon)*t,yy=horizon+(base-horizon)*tt;let wid=trackTop+(trackBottom-trackTop)*t,wid2=trackTop+(trackBottom-trackTop)*tt;poly([[W/2-wid/2,y],[W/2-wid2/2,yy],[W/2-wid2/2-5,yy],[W/2-wid/2-2,y]],i%2?'#f8f8fa':'#f94358');poly([[W/2+wid/2,y],[W/2+wid2/2,yy],[W/2+wid2/2+5,yy],[W/2+wid/2+2,y]],i%2?'#f8f8fa':'#f94358')}let laneCount=8;for(let i=1;i<laneCount;i++){let x1=W/2-trackTop/2+trackTop*i/laneCount,x2=W/2-trackBottom/2+trackBottom*i/laneCount;ctx.strokeStyle='#ffffff50';ctx.setLineDash([15,22]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,horizon);ctx.lineTo(x2,base);ctx.stroke();ctx.setLineDash([])}let sorted=[...cars].sort((a,b)=>a.progress-b.progress);for(let c of sorted){let relative=(c.progress%1);let depth=.27+.61*(1-relative);let y=horizon+(base-horizon)*depth;let roadWidth=trackTop+(trackBottom-trackTop)*depth;let laneWidth=roadWidth/laneCount;let x=W/2-roadWidth/2+laneWidth*(c.lane+.5);let cw=Math.min(42,laneWidth*.78)*(0.5+depth*.7);drawCar(x,y,cw,cw*1.8,c.color,c.turbo>0||c.super>0);ctx.textAlign='center';ctx.font='bold '+Math.max(10,Math.min(14,cw*.36))+'px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#0a1020';ctx.strokeText(c.name,x,y-cw*1.15);ctx.fillStyle='#fff';ctx.fillText(c.name,x,y-cw*1.15)}if(phase==='results'){ctx.fillStyle='#050917b9';ctx.fillRect(0,H*.43,W,H*.16);ctx.fillStyle='#ffdf65';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText('🏆 FIM DA CORRIDA!',W/2,H*.50);ctx.font='14px system-ui';ctx.fillStyle='white';ctx.fillText('Próxima rodada em '+Math.ceil(pause)+'s',W/2,H*.54)}}function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(frame)}announce('❤️ Siga o perfil para entrar na corrida!');requestAnimationFrame(frame);
// Integração futura: quando houver evento de novo seguidor confirmado, chamar onFollow(username).
// ATENÇÃO: este HTML não verifica seguidores nem recebe eventos do TikTok por conta própria.
window.TurboRaceLive={onFollow,add,boost};
</script></body></html>
